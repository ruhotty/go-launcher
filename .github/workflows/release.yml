name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows app
        run: dotnet publish src/GoLauncher/GoLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path src/GoLauncher/bin/Release/net8.0-windows/win-x64/publish/* -DestinationPath GoLauncher-1.0-beta-win-x64.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-beta
          name: Go Launcher 1.0 Beta
          prerelease: true
          generate_release_notes: true
          files: GoLauncher-1.0-beta-win-x64.zip
